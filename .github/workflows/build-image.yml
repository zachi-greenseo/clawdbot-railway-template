name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zachi-greenseo/clawdbot-railway-template:latest
            ghcr.io/zachi-greenseo/clawdbot-railway-template:${{ github.sha }}
          build-args: |
            OPENCLAW_GIT_REF=v2026.10.3
          cache-from: type=gha
          cache-to: type=gha,mode=max
